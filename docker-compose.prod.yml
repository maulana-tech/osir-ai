services:
  migrate:
    build: .
    command: python manage.py migrate --noinput
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/osir_ai
    depends_on:
      postgres:
        condition: service_healthy

  app:
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2
    volumes:
      - media_data:/app/media
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/osir_ai
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    volumes:
      - media_data:/app/media
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/osir_ai
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # The web UI's server-side fetches go back in through Caddy (same origin the
  # browser uses), so cookies, CSRF and X-Forwarded-Proto all line up.
  console:
    ports: []
    environment:
      - STUDIO_URL=https://${APP_DOMAIN:-localhost}

  agent-worker:
    environment:
      - STUDIO_URL=https://${APP_DOMAIN:-localhost}

  postgres:
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      - APP_DOMAIN=${APP_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - console
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
