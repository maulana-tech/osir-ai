# Pre-commit hooks for Osir AI.
# Install: pip install pre-commit && pre-commit install
# Run on all files: pre-commit run --all-files
# Reference: https://pre-commit.com
#
# Scope: the Django backend. `agent/` has its own venv (cd agent && pytest) and
# `web/` its own toolchain (npm run typecheck); both are built in CI.
exclude: ^(web/|agent/\.venv/)

default_language_version:
  python: python3.12

repos:
  # Basic hygiene: trailing whitespace, EOF newlines, large files, merge conflicts, etc.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # Ruff: lint + format (replaces black, isort, flake8, pyupgrade, etc.)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # mypy: static type checking for Python. Runs the project's own mypy (from
  # requirements.txt) so django-stubs can import settings with every
  # dependency present — an isolated hook env would lack django-environ etc.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: env SECRET_KEY=pre-commit mypy --ignore-missing-imports
        language: system
        types: [python]
        files: ^(apps|config|providers|tests)/
        require_serial: true

  # gitleaks: block commits that contain secrets
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # Django: run Django's own system checks
  - repo: local
    hooks:
      - id: django-check
        name: django-check
        entry: python manage.py check
        language: system
        pass_filenames: false
        files: \.(py|html)$
        stages: [pre-push]
